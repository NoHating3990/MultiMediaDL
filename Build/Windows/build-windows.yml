# Builds MultiMedia-Downloader.exe on a free Windows machine in the cloud.
# Put this file at  .github/workflows/build-windows.yml  in your GitHub repo,
# next to ytdlp-gui.py and icon.ico, then run it from the repo's "Actions" tab.
name: Build Windows exe

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    tags: ["v*"]            # pushing a tag like v1.0 also publishes a Release

permissions:
  contents: write           # needed to attach the exe to a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # includes Tcl/Tk

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed
          --name MultiMedia-Downloader
          --icon icon.ico
          --add-data "icon.ico;."
          ytdlp-gui.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: MultiMedia-Downloader-windows
          path: dist/MultiMedia-Downloader.exe

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MultiMedia-Downloader.exe
